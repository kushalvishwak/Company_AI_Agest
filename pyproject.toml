[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-ai-agent-stack"
version = "0.1.0"
description = "Reference implementation of the layered architecture behind a production internal AI assistant: system prompt, RAG, tools/MCP, RBAC/OAuth, guardrails, cache/routing, and observability/evals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]
